<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học Tiếng Trung Toàn Diện — 60 Chủ Đề, Chữ Hán & Ngữ Pháp</title>
  <meta name="description" content="Trang web đọc và học tiếng Trung trực tuyến: Trọn bộ 60 chủ đề chuẩn 4 tầng ngôn ngữ, 214 bộ thủ, 2500 chữ Hán, phát âm giọng chuẩn, bài tập phản xạ tương tác.">

  <!-- Open Graph -->
  <meta property="og:title" content="Giáo Trình Học Tiếng Trung Toàn Diện">
  <meta property="og:description" content="Kho tàng tri thức tiếng Trung: 214 Bộ thủ, 2500 Chữ Hán, Ngữ pháp chuyên sâu và Trọn bộ 60 Chủ đề chuẩn 4 tầng ngôn ngữ.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🈴</text></svg>">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app" class="app-container">

    <!-- Top Sticky Header -->
    <header class="top-header">
      <div class="header-left">
        <button id="menuToggleBtn" class="menu-toggle-btn" aria-label="Mở menu" title="Mở danh mục bài học">☰</button>
        <a href="#/TiengTrungTheoChuDe/0-tong-quan.md" class="brand-logo">
          <span class="brand-icon">漢</span>
          <span>Học Tiếng Trung</span>
        </a>
      </div>

      <div class="header-actions">
        <!-- Font Size Adjusters -->
        <button id="fontSizeDecreaseBtn" class="action-btn" title="Giảm cỡ chữ">A−</button>
        <button id="fontSizeIncreaseBtn" class="action-btn" title="Tăng cỡ chữ">A+</button>

        <!-- Dark / Light Mode Toggle -->
        <button id="themeToggleBtn" class="action-btn" title="Chuyển chế độ sáng/tối">
          🌙 <span>Tối</span>
        </button>

        <!-- GitHub Repository Link -->
        <a href="https://github.com/tcmytt/Learning-Chinese" target="_blank" rel="noopener noreferrer" class="action-btn" title="Mã nguồn GitHub">
          ⭐ <span>GitHub</span>
        </a>
      </div>
    </header>

    <!-- Main Content Layout -->
    <div class="main-wrapper">

      <!-- Left Sidebar (Tree Navigation & Progress) -->
      <aside id="sidebar" class="sidebar">
        <!-- Live Search -->
        <div class="sidebar-search-box">
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm bài học, chủ đề..." autocomplete="off">
          </div>
        </div>

        <!-- Learning Progress -->
        <div class="progress-widget">
          <div class="progress-info">
            <span>Tiến độ học tập</span>
            <span id="progressText">0 / 65 bài (0%)</span>
          </div>
          <div class="progress-bar-container">
            <div id="progressBarFill" class="progress-bar-fill"></div>
          </div>
        </div>

        <!-- Category Tree Navigation -->
        <nav id="sidebarNav" class="sidebar-nav">
          <!-- Populated dynamically via manifest.js & app.js -->
        </nav>
      </aside>

      <!-- Mobile Backdrop -->
      <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

      <!-- Center Reading Column -->
      <main class="content-container">

        <!-- Reading Assistance Control Bar -->
        <div class="reading-controls">
          <div class="controls-left">
            <label class="switch-label" title="Ẩn hoặc hiện phiên âm Pinyin để luyện nhớ mặt chữ Hán">
              <input type="checkbox" id="pinyinToggleCheckbox" checked>
              <span>Hiện Pinyin</span>
            </label>

            <label class="switch-label" title="Ẩn hoặc hiện âm Hán Việt">
              <input type="checkbox" id="hanvietToggleCheckbox" checked>
              <span>Hiện Hán Việt</span>
            </label>
          </div>

          <div class="controls-right">
            <button id="markCompletedBtn" class="btn-mark-completed" title="Đánh dấu đã hoàn thành bài học này">
              ⚪ <span>Đánh dấu đã học</span>
            </button>
          </div>
        </div>

        <!-- Rendered Markdown Body -->
        <article id="contentBody" class="markdown-body">
          <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
            <div style="font-size: 2rem; margin-bottom: 0.75rem;">⏳</div>
            <div>Đang khởi tạo giáo trình học tập...</div>
          </div>
        </article>

        <!-- Previous / Next Lesson Pager -->
        <div id="lessonNavContainer"></div>

      </main>

      <!-- Right Table of Contents (Desktop Sticky) -->
      <aside id="tocSidebar" class="toc-sidebar">
        <div class="toc-title">Mục Lục Bài Học</div>
        <ul id="tocList" class="toc-list">
          <!-- Auto-generated from H2 & H3 headings -->
        </ul>
      </aside>

    </div>
  </div>

  <!-- Vendor Scripts -->
  <script src="assets/vendor/marked.min.js"></script>
  <!-- Fallback if marked.min.js fails to load locally -->
  <script>
    if (typeof marked === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>');
    }
  </script>

  <!-- Application Scripts -->
  <script src="assets/js/manifest.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
